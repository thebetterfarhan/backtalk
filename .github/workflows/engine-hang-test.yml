name: Fork engine hang test

on:
  workflow_dispatch:
  push:
    branches: [test/side-by-side-pr218]

jobs:
  engine-hang:
    if: github.repository != 'trypsynth/backtalk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build fork test APK and fake engine
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug -PbacktalkTestPackage --console=plain
          ./gradlew -p fork-tests/engine-hang assembleDebug --console=plain

      - name: Create emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name backtalk-hang --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          emulator/emulator -avd backtalk-hang -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel auto > emulator.log 2>&1 &
          adb wait-for-device
          until adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; do sleep 2; done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install and configure test apps
        shell: bash
        run: |
          set -euo pipefail
          adb install -r build/outputs/apk/phone/debug/backtalk-phone-debug.apk
          adb install -r fork-tests/engine-hang/app/build/outputs/apk/debug/app-debug.apk
          adb shell settings put secure enabled_accessibility_services fyi.quin.backtalk.test/com.google.android.marvin.talkback.TalkBackService
          adb shell settings put secure accessibility_enabled 1
          adb shell settings put secure tts_default_synth com.example.backtalkenginehang
          adb shell am force-stop fyi.quin.backtalk.test
          adb shell am force-stop com.example.backtalkenginehang
          adb shell monkey -p com.example.backtalkenginehang 1

      - name: Trigger split speech and assert recovery
        shell: bash
        run: |
          set -euo pipefail
          adb shell input keyevent 61
          for attempt in $(seq 1 30); do
            if adb logcat -d -s BackTalkHangTest:I '*:S' | grep -q 'HANG_INJECTED'; then break; fi
            sleep 1
          done
          adb logcat -d -s BackTalkHangTest:I '*:S' | grep -q 'TTS_ENGINE_SELECTED'
          adb logcat -d -s BackTalkHangTest:I '*:S' | grep -q 'HANG_INJECTED'
          adb shell input keyevent 61
          for attempt in $(seq 1 30); do
            if adb logcat -d | grep -q 'RECOVERY_REQUEST'; then break; fi
            sleep 1
          done
          adb logcat -d | grep -q 'RECOVERY_REQUEST'
          adb logcat -d | grep -E -q 'TTS engine .*said nothing for .* so it is hung'

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          adb logcat -d > engine-hang-logcat.txt || true
          cat emulator.log || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: engine-hang-diagnostics
          path: |
            engine-hang-logcat.txt
            emulator.log
